name: Waka Readme

on:
  workflow_dispatch:
  schedule:
    # Runs at 00:00AM UTC
    - cron: '0 0 * * *'

jobs:
  update-readme:
    name: Update this repo's README
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: waka-readme
      cancel-in-progress: false
    steps:
      - name: Check WakaTime OAuth setup
        id: wakatime
        env:
          WAKATIME_OAUTH_TOKEN: ${{ secrets.WAKATIME_OAUTH_TOKEN || secrets.WAKATIME_API_KEY }}
        shell: bash
        run: |
          if [ -n "$WAKATIME_OAUTH_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Coding stats skipped: add WAKATIME_OAUTH_TOKEN in repository Actions secrets."
            echo "WakaTime now requires a personal OAuth token to read statistics. Create one at https://wakatime.com/oauth and save it as WAKATIME_OAUTH_TOKEN in this repository's Actions secrets. Plugin API keys cannot read statistics." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check out profile repository
        if: steps.wakatime.outputs.ready == 'true'
        uses: actions/checkout@v4
      - name: Update WakaTime coding activity
        if: steps.wakatime.outputs.ready == 'true'
        env:
          WAKATIME_OAUTH_TOKEN: ${{ secrets.WAKATIME_OAUTH_TOKEN || secrets.WAKATIME_API_KEY }}
        run: python3 .github/scripts/update_waka.py
      - name: Commit updated coding activity
        if: steps.wakatime.outputs.ready == 'true'
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo "README is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update WakaTime coding activity"
          git push origin HEAD:master
